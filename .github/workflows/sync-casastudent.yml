name: Sync CasaStudent master

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  SOURCE_REPO: alessandroschiavon73-design/CasaStudentItaly
  CASA_URL: https://casastudent.it
  STUDENT_URL: https://studentbnb.it
  BRAND_VERSION: '5'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the latest country portal
        run: |
          git clone --depth 1 "https://github.com/${SOURCE_REPO}.git" /tmp/casastudent
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'CNAME' \
            --exclude 'assets/css/studentbnb-brand.css' \
            --exclude 'assets/js/studentbnb-brand.js' \
            --exclude 'assets/js/config.js' \
            --exclude 'assets/js/city-visuals.js' \
            /tmp/casastudent/ ./
      - name: Restore StudentBnB identity
        run: |
          find . -maxdepth 1 -name '*.html' -print0 | while IFS= read -r -d '' file; do
            if ! grep -q 'studentbnb-brand.css' "$file"; then
              sed -i "s#</head>#<link rel=\"stylesheet\" href=\"assets/css/studentbnb-brand.css?v=${BRAND_VERSION}\"></head>#" "$file"
            fi
            if ! grep -q 'studentbnb-brand.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/studentbnb-brand.js?v=${BRAND_VERSION}\"></script></body>#" "$file"
            fi
            sed -i -E "s/studentbnb-brand\.(css|js)\?v=[0-9]+/studentbnb-brand.\\1?v=${BRAND_VERSION}/g" "$file"
            sed -i 's/content="#ffc400"/content="#0F766E"/g; s/| CasaStudent/| StudentBnB/g; s/CasaStudent —/StudentBnB —/g; s/aria-label="CasaStudent home"/aria-label="StudentBnB home"/g' "$file"
            sed -i 's#https://casastudent\.eu/#https://studentbnb.eu/#g; s#https://casastudent\.it/#https://studentbnb.it/#g; s#https://casastudent\.es/#https://studentbnb.es/#g; s#https://casastudent\.fr/#https://studentbnb.fr/#g; s#https://casastudent\.de/#https://student-bnb.de/#g; s#https://casastudent\.pl/#https://studentbnb.pl/#g; s#https://casastudent\.pt/#https://studentbnb.pt/#g; s/· casastudent\.it/· studentbnb.it/g; s/· casastudent\.es/· studentbnb.es/g; s/· casastudent\.fr/· studentbnb.fr/g; s/· casastudent\.de/· student-bnb.de/g; s/· casastudent\.pl/· studentbnb.pl/g; s/· casastudent\.pt/· studentbnb.pt/g' "$file"
            casa_host="${CASA_URL#https://}"; student_host="${STUDENT_URL#https://}"
            sed -i "s/@${casa_host}/@${student_host}/g" "$file"
            CASA_URL="$CASA_URL" STUDENT_URL="$STUDENT_URL" perl -0pi -e 's#(<link rel="canonical" href=")\Q$ENV{CASA_URL}\E/#$1$ENV{STUDENT_URL}/#g' "$file"
          done
          for file in robots.txt sitemap.xml; do
            [ -f "$file" ] && CASA_URL="$CASA_URL" STUDENT_URL="$STUDENT_URL" perl -pi -e 's#\Q$ENV{CASA_URL}\E#$ENV{STUDENT_URL}#g' "$file"
          done
      - name: Publish synchronized files
        run: |
          git config user.name 'StudentBnB Sync'
          git config user.email 'actions@github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Sync country portal while preserving StudentBnB identity [skip ci]'
            git push
          fi
