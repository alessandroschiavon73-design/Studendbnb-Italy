name: Sync CasaStudent master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-casastudent.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alessandroschiavon73-design/CasaStudentItaly.git /tmp/casastudent
      - run: rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'CNAME' /tmp/casastudent/ ./
      - name: Apply StudentBnB identity and concept
        run: |
          mkdir -p assets/css assets/js
          cat > assets/css/studentbnb-brand.css <<'EOF'
          :root{--yellow:#0F766E;--yellow-dark:#115E59;--yellow-soft:#CCFBF1}.site-header{background:#0F766E;color:#fff}.site-header .brand,.site-header .main-nav a,.site-header .account-link{color:#fff}.site-header .brand strong{color:#99F6E4;text-shadow:none}.site-header .brand small{color:#D8F3EF}.site-header .brand>span::after{content:'a CasaStudent project';display:block;font-size:10px;font-weight:650;letter-spacing:.035em;color:#CCFBF1;margin-top:1px}.breadcrumb{background:#0F766E;color:#fff}.btn-yellow{background:#0F766E;color:#fff}.hero-copy h1 span,.kicker{color:#0F766E}.studentbnb-tagline{display:inline-block;margin:8px 0 14px;font-size:15px;font-weight:900;letter-spacing:.04em;color:#0F766E}.studentbnb-concept{max-width:520px}.casastudent-family{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:13px}.casastudent-family a{font-weight:800;text-decoration:underline;text-underline-offset:3px}
          EOF
          cat > assets/js/studentbnb-brand.js <<'EOF'
          document.addEventListener('DOMContentLoaded',()=>{
            const brand=document.querySelector('.site-header .brand');
            if(brand){brand.setAttribute('aria-label','StudentBnB home');const txt=brand.querySelector(':scope > span:last-child');if(txt){txt.innerHTML='Student<strong>BnB</strong><small>Base to belong</small>';}}
            const hero=document.querySelector('.home-hero .hero-copy');
            if(hero){const h=hero.querySelector('h1');const p=hero.querySelector(':scope > p');if(h){const old=hero.querySelector('.studentbnb-tagline');if(old)old.remove();h.innerHTML='Student <span>B&B</span>';const t=document.createElement('div');t.className='studentbnb-tagline';t.textContent='Prova prima di scegliere.';h.after(t);}if(p){p.classList.add('studentbnb-concept');p.textContent='Vivi qualche giorno nella tua possibile futura casa, conosci i tuoi futuri coinquilini e decidi con più sicurezza prima del trasferimento definitivo.';}const sh=hero.querySelector('.search-card h2');if(sh)sh.textContent='Dove vuoi fare una prova?';}
            const f=document.querySelector('.site-footer .container')||document.querySelector('footer');if(f&&!f.querySelector('.casastudent-family')){const b=document.createElement('div');b.className='casastudent-family';b.innerHTML='StudentBnB è parte della famiglia <a href="https://casastudent.it/">CasaStudent ↗</a> · StudentBnB per provare, CasaStudent per restare.';f.appendChild(b)}
          });
          EOF
          find . -maxdepth 1 -name '*.html' -print0 | while IFS= read -r -d '' f; do sed -i 's#</head>#<link rel="stylesheet" href="assets/css/studentbnb-brand.css?v=3"></head>#' "$f"; sed -i 's#</body>#<script src="assets/js/studentbnb-brand.js?v=3"></script></body>#' "$f"; sed -i 's#<title>CasaStudent#<title>StudentBnB#g' "$f"; sed -i 's#aria-label="CasaStudent home"#aria-label="StudentBnB home"#g' "$f"; sed -i 's|content="#ffc400"|content="#0F766E"|g' "$f"; done
      - run: |
          git config user.name 'StudentBnB Sync'; git config user.email 'actions@github.com'; git add -A; if ! git diff --cached --quiet; then git commit -m 'Sync CasaStudent with StudentBnB header and try-before-you-move concept [skip ci]'; git push; fi
