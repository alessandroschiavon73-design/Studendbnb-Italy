<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/style.css"><title>StudentBnB Statistics</title><style>body{background:#f7f8fa}.stats-wrap{max-width:1050px;margin:0 auto;padding:42px 20px 80px}.stats-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.stats-head h1{margin:0;font-size:38px}.stats-head a{font-weight:800}.stats-note{background:#fff5cc;border:1px solid #ead17a;border-radius:14px;padding:14px 16px;margin:18px 0 26px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stats-card{background:#fff;border:1px solid #e2e4e7;border-radius:16px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.05)}.stats-card b{display:block;font-size:32px;margin-top:5px}.stats-card span{color:#666;font-size:13px}.stats-wide{margin-top:16px}.stats-wide h2{margin-top:0}.stats-table{width:100%;border-collapse:collapse}.stats-table td,.stats-table th{padding:10px;border-bottom:1px solid #eee;text-align:left}.stats-actions{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}.stats-actions button,.stats-actions a{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#ffc400;color:#171717}.secondary{background:#171717;color:#fff}@media(max-width:760px){.stats-grid{grid-template-columns:repeat(2,1fr)}.stats-head{align-items:flex-start;flex-direction:column}}</style><link rel="stylesheet" href="assets/css/studentbnb-brand.css?v=4"></head><body><main class="stats-wrap"><div class="stats-head"><div><div style="font-weight:900">Student<span style="color:#dca900">BnB</span> · Base &amp; Belong</div><h1 id="stats-title">Statistics</h1></div><a href="index.html" id="back">← Home</a></div><div class="stats-note" id="stats-note"></div><div class="stats-grid"><div class="stats-card"><span id="l-views">Page views s.pages||{}).sort((a,b)=>b[1]-a[1]).forEach(([p,n])=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${p}</td><td>${n}</td>`;rows.appendChild(tr)});if(!rows.children.length)rows.innerHTML='<tr><td colspan="2">—</td></tr>';txt('period',`${s.firstSeen||'—'} → ${s.lastSeen||'—'}`);const active=cfg.apiEnabled===true||cfg.apiMode==='live';txt('central',active?'Central analytics API: ACTIVE':'Central analytics API: not active yet');}document.getElementById('refresh').onclick=render;document.getElementById('reset').onclick=()=>{if(confirm(T[11]+'?')){localStorage.removeItem(`studentbnb:stats:${c}:v1`);render()}};render()})();</script><script src="assets/js/studentbnb-brand.js?v=4"></script></body></html>
